
[FILTER]
    Name lua
    Match *
    code local LOG_GROUP = os.getenv("LOG_GROUP") or "/aws/fluentbit-workshop/lab1/media-analytics"; local NAMESPACE = os.getenv("METRIC_NAMESPACE") or "Lab1MediaAnalytics/LogThroughput"; local last_throughput_time = 0; local total_bytes = 0; local last_total_bytes = 0; local task_arn = nil; function get_task_arn_from_record(record) if task_arn then return task_arn; end; if record and record.ecs_task_arn then task_arn = record.ecs_task_arn; return task_arn; end; return "UNKNOWN"; end; function measure_throughput(tag, timestamp, record) local record_str = ""; for k, v in pairs(record) do record_str = record_str .. tostring(k) .. ":" .. tostring(v) .. " "; end; local record_size = string.len(record_str); total_bytes = total_bytes + record_size; local now = os.time(); if last_throughput_time == 0 then last_throughput_time = now; last_total_bytes = total_bytes; return 1, timestamp, record; end; if now - last_throughput_time >= 10 then local bytes_processed = total_bytes - last_total_bytes; local time_elapsed = now - last_throughput_time; local throughput_mbps = (bytes_processed / time_elapsed) / (1000 * 1000); local current_task_arn = get_task_arn_from_record(record); local emf_json = string.format('{"ThroughputMbps":%f,"TaskArn":"%s","_aws":{"CloudWatchMetrics":[{"Namespace":"%s","Dimensions":[["LogGroup","TaskArn"]],"Metrics":[{"Name":"ThroughputMbps","Unit":"Megabytes/Second","StorageResolution":1}]}],"Timestamp":%d},"LogGroup":"%s"}', throughput_mbps, current_task_arn, NAMESPACE, now * 1000, LOG_GROUP); print(emf_json); io.flush(); last_throughput_time = now; last_total_bytes = total_bytes; end; return 1, timestamp, record; end
    call measure_throughput
